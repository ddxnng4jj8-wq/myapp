<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON練習</title>
</head>
<body>

    <script>
        const user = {
            username: "taro",
            age: 20
        };

        console.log(user.username);
        console.log(user["age"]);

        const jsonText = '{"username":"taro","age":20}';

        console.log(typeof user);
        console.log(typeof jsonText);
    </script>

</body>
</html>
