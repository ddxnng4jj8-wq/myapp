<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット</title>
</head>
<body>
  <h1>チャット</h1>

  <form id="form">
    <input type="text" id="username" placeholder="名前" required>
    <input type="text" id="text" placeholder="メッセージ" required>
    <button type="submit">送信</button>
  </form>

  <ul id="messages"></ul>

  <script>
    async function getMessages() {
      const response = await fetch('/api/messages');
      const messages = await response.json();

      const ul = document.getElementById('messages');
      ul.innerHTML = '';

      messages.forEach(message => {
        const li = document.createElement('li');
        li.textContent = `${message.username}: ${message.text}`;
        ul.appendChild(li);
      });
    }

    async function postMessage(username, text) {
      await fetch('/api/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, text })
      });
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const text = document.getElementById('text').value;

      await postMessage(username, text);

      document.getElementById('text').value = '';

      getMessages();
    });

    getMessages();
    setInterval(getMessages, 3000);
  </script>
</body>
</html>
